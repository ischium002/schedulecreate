<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天要来点直播吗?</title>
    <style>
    :root {
        --accent: #8d95ea;
        --panel: rgba(35, 37, 58, 0.9);
        --panel2: #2c2f4a;
        --line: rgba(141, 149, 234, 0.35);
        --text: #e8e9f5;
        --muted: #9aa0c5;
    }

    * { box-sizing: border-box; }

    body {
        font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
        background: linear-gradient(130deg, #15161f, #43456b 55%, #15161f);
        color: var(--text);
        margin: 0;
        min-height: 100vh;
    }

    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: stretch;
        justify-content: center;
        padding: 12px 16px;
        background: rgba(21, 22, 31, 0.92);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 1000;
    }

    .group {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .group > label {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.08em;
    }

    .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
    }

    .chip {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .chip:hover { border-color: var(--accent); }

    .chip.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #15161f;
        font-weight: 700;
    }

    input[type="text"], input[type="date"] {
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--text);
        padding: 6px 10px;
        font-size: 14px;
        width: 170px;
    }

    input::placeholder { color: var(--muted); }

    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); }

    .export-btn {
        background: var(--accent);
        color: #15161f;
        font-weight: 700;
        border: none;
        border-radius: 8px;
        padding: 8px 16px;
        cursor: pointer;
        font-size: 15px;
    }

    .export-btn.secondary {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--accent);
    }

    .export-btn:hover { filter: brightness(1.15); }

    .stage-outer {
        position: relative;
        margin: 20px auto;
        overflow: hidden;
    }

    #canvasContainer {
        position: relative;
        width: 1920px;
        height: 1080px;
        transform-origin: top left;
    }

    #canvasContainer canvas { border-radius: 10px; }
</style>
</head>
<body>
    <div class="controls">
    <div class="group">
        <label>选择日期</label>
        <div class="row">
            <input type="date" id="dateSelector" onchange="updateDate()" />
        </div>
    </div>

    <div class="group">
        <label>这都周几了</label>
        <div class="row" id="daySeg">
            <button class="chip active" onclick="selectDay(0)">一</button>
            <button class="chip" onclick="selectDay(1)">二</button>
            <button class="chip" onclick="selectDay(2)">三</button>
            <button class="chip" onclick="selectDay(3)">四</button>
            <button class="chip" onclick="selectDay(4)">五</button>
            <button class="chip" onclick="selectDay(5)">六</button>
            <button class="chip" onclick="selectDay(6)">日</button>
        </div>
    </div>

    <div class="group">
        <label>加班？</label>
        <div class="row">
            <button class="chip" id="btnOvertime" onclick="toggleActivity('加班')">猛猛加🔥</button>
            <button class="chip" id="btnRest" onclick="toggleActivity('休息')">歇逼🛌</button>
            <input id="customActivity" type="text" placeholder="还是说玩点别的？" oninput="setActivity(this.value)">
        </div>
    </div>

    <div class="group">
        <label>肘谁？</label>
        <div class="row">
            <button class="chip" data-area="鸟区" onclick="updateArea('鸟区')">🐦🐢 鸟区</button>
            <button class="chip" data-area="猫区" onclick="updateArea('猫区')">🐱💥 猫区</button>
            <button class="chip" data-area="猪区" onclick="updateArea('猪区')">🐖🪃 猪区</button>
            <button class="chip" data-area="狗区" onclick="updateArea('狗区')">🐶🚶 狗区</button>
            <button class="chip" data-area="国际服" onclick="updateArea('国际服')">🤖 国际服</button>
            <input id="customArea" type="text" placeholder="还有别的地方？" oninput="updateCustomArea(this.value)">
        </div>
    </div>

    <div class="group">
        <label>导出</label>
        <div class="row">
            <button class="export-btn" onclick="saveAsImage()">就这样！</button>
            <button class="export-btn secondary" onclick="exportCalendar()">只要日历</button>
        </div>
    </div>
</div>

<div class="stage-outer" id="stageOuter">
    <div id="canvasContainer">
        <canvas id="interactiveCanvas" width="1920" height="1080" style="position: absolute; left: 0; top: 0; z-index: 1;"></canvas>
        <canvas id="calendarCanvas" width="551" height="611" style="position: absolute; left: 1360px; top: 464px; z-index: 10;"></canvas>
    </div>
</div>

<script>

    const mainCanvas = document.getElementById("interactiveCanvas");
    const mainCtx = mainCanvas.getContext("2d");

    const calendarCanvas = document.getElementById("calendarCanvas");
    const calendarCtx = calendarCanvas.getContext("2d");

    const background = new Image();
	background.crossOrigin = "anonymous"; // 图床跨域，不加这个 toDataURL 导出会被污染报错
	background.src = "https://res.cloudinary.com/dp5ayfo4z/image/upload/v1781185144/_background_xe22yj.png";
	
	
    const days = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
    const positions = [
        { dayX: 352, areaX: 786, y: 244 },
        { dayX: 352, areaX: 786, y: 368 },
        { dayX: 352, areaX: 786, y: 480 },
        { dayX: 352, areaX: 786, y: 594 },
        { dayX: 352, areaX: 786, y: 710 },
        { dayX: 352, areaX: 786, y: 827 },
        { dayX: 352, areaX: 786, y: 940 }
    ];

    // 7.x 八日轮换：尘封→碎冰→草原→沃克→尘封→阵地→草原→沃克
    const battleFields = ["尘封秘岩", "碎冰", "大草原", "沃克奇特", "尘封秘岩", "阵地", "大草原", "沃克奇特"];
    const selectedActivities = Array(7).fill("");
    const selectedAreas = Array(7).fill([]);

    const calendarConfig = {
        x: 0,
        y: 0,
        width: 551,
        height: 611
    };

    background.onload = () => {
        drawMainCanvas();
        drawCalendar();
    };
	let selectedDate = new Date(); // 默认值为今天
	function updateDate() {
	    const dateInput = document.getElementById("dateSelector").value;
	    if (dateInput) {
	        selectedDate = new Date(dateInput);
	        console.log("Selected Date:", selectedDate);
			// 清空自定义输入框内容
			document.getElementById("customArea").value = "";
			document.getElementById("customActivity").value = "";

			// 清空与自定义输入框相关的状态
			selectedActivities.fill(""); // 清空活动数组
			selectedAreas.forEach((area, index) => selectedAreas[index] = []); // 清空区域数组
			customAreas.fill("");
			syncControls();
	        drawMainCanvas(); // 重新绘制周表
	        drawCalendar(); // 重新绘制日历
	    }
	}
    function calculateBattleField(dayIndex) {
        // 修复负索引问题
        const rotationIndex = ((dayIndex % battleFields.length) + battleFields.length) % battleFields.length;
    
        return battleFields[rotationIndex];
    }



	function calculateBattleFielda(dayIndex) {
	    // 计算本周的周一
	    const dayOfWeek = (selectedDate.getDay() + 6) % 7; // 将周日(0)变为6，其它天减1
	        const monday = new Date(selectedDate);
	        monday.setDate(selectedDate.getDate() - dayOfWeek);
	    console.log("Monday of this week:", monday);
	
	    // 修正基准日期，确保与本地时间一致
	    const baseDate = new Date("2026-05-02T00:00:00+08:00"); // 2026-05-02 = 尘封秘岩（八日循环第0天）
	   // console.log("Base Date:", baseDate);
	
	    const daysSinceBase = Math.floor((monday - baseDate) / (1000 * 60 * 60 * 24));
	    //console.log("Days Since Base:", daysSinceBase);
	
	    // 修复负索引问题，保持循环逻辑
	    const rotationIndex = ((daysSinceBase + dayIndex) % battleFields.length + battleFields.length) % battleFields.length;
	   // console.log("Rotation Index:", rotationIndex);
	
	    const selectedBattleField = battleFields[rotationIndex];
	   // console.log("Selected BattleField:", selectedBattleField);
	
	    return selectedBattleField;
	}



	
    function drawMainCanvas() {
        mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
        mainCtx.drawImage(background, 0, 0, mainCanvas.width, mainCanvas.height);
        
        mainCtx.font = "italic bold 51px heiti"; 
        positions.forEach((pos, index) => {
            const activity = selectedActivities[index] || calculateBattleFielda(index);
            const area = [...selectedAreas[index], customAreas[index]].filter(Boolean).join("+");
    

    
            // 设置周六和周日的颜色为黑色，其余为默认颜色
            if (days[index] === "周六" || days[index] === "周日") {
                mainCtx.fillStyle = "#000000"; // 黑色
            } else {
                mainCtx.fillStyle = "#fefefe"; // 默认颜色
            }
    
            mainCtx.fillText(`${days[index]}    ${activity}`, pos.dayX, pos.y);
            mainCtx.fillText(area || "", pos.areaX, pos.y);
        });
		// 在背景图的相对位置绘制当月数字
		    const monthTextX = 1835; // X 坐标
		    const monthTextY = 430; // Y 坐标
		    const monthb = selectedDate.getMonth() + 1; // 获取当前月份（0~11 转为 1~12）
		
		    // 设置字体样式和颜色
		    mainCtx.font = "bold 60px heiti "; // 大字体
		    mainCtx.fillStyle = "#f8e9d9"; // 字体颜色（白色）
		    mainCtx.textAlign = "center"; // 水平居中
		    mainCtx.textBaseline = "middle"; // 垂直居中
		
		    // 绘制月份数字
		    mainCtx.fillText(`${monthb}月`, monthTextX, monthTextY);
			// 绘制完成后恢复默认设置
			mainCtx.textAlign = "start"; // 恢复为默认左对齐
			mainCtx.textBaseline = "alphabetic"; // 恢复为基线对齐
			
			console.log("Positions:", positions);
			console.log("Selected Activities:", selectedActivities);

    }



    function drawCalendar() {
    calendarCtx.clearRect(0, 0, calendarCanvas.width, calendarCanvas.height);
	console.log("Calendar canvas cleared.");
    const year = selectedDate.getFullYear();
        const month = selectedDate.getMonth();
        const firstDay = (new Date(year, month, 1).getDay() + 6) % 7;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
    const weekdays = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];

  

    const cellWidth = calendarConfig.width / 7;
    const cellHeight = calendarConfig.height / 7;
    const currentDay = selectedDate.getDate();

    calendarCtx.font = "bold 20px Arial Rounded MT";
    calendarCtx.textAlign = "center";
    calendarCtx.textBaseline = "middle";

    
    // 绘制首行背景颜色和星期文字
    calendarCtx.fillStyle = "#7482d0"; // 首行填充颜色
    calendarCtx.fillRect(calendarConfig.x, calendarConfig.y, calendarConfig.width, cellHeight);
    
    weekdays.forEach((day, index) => {
        const cellX = calendarConfig.x + index * cellWidth;
        calendarCtx.fillStyle = "#ffffff"; // 星期字体颜色
        calendarCtx.fillText(day, cellX + cellWidth / 2, calendarConfig.y + cellHeight / 2);
    });
    


    
    // 绘制日期和战场模式
    let day = 1;
    for (let row = 1; row <= 6; row++) {
        for (let col = 0; col < 7; col++) {
            const cellX = calendarConfig.x + col * cellWidth;
            const cellY = calendarConfig.y + row * cellHeight;
			
			calendarCtx.save(); // 保存当前绘图状态
	// 设置默认背景颜色（包括空白格）
            calendarCtx.fillStyle = "#343437";
            calendarCtx.globalAlpha = 0.8; // 设置透明度为 50%
            calendarCtx.fillRect(cellX, cellY, cellWidth, cellHeight);
            // 跳过空白格
			if (row === 1 && col < firstDay) continue; // 确保只跳过实际空白格
            if (day > daysInMonth) continue;
	// 计算当前绘制的日期
	        const currentDay = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), day);
	        const selectedDayOfWeek = (selectedDate.getDay() + 6) % 7; // selectedDate对应的周一为0，周日为6
	        const selectedWeekStart = new Date(selectedDate);
	        selectedWeekStart.setDate(selectedDate.getDate() - selectedDayOfWeek); // 选中日期所在周的周一
            //console.log(`selectedWeekStart :${selectedWeekStart}`);
	        const selectedWeekEnd = new Date(selectedWeekStart);
	        selectedWeekEnd.setDate(selectedWeekStart.getDate() + 6); // 选中日期所在周的周日
			
			const truncateTime = (date) => new Date(date.getFullYear(), date.getMonth(), date.getDate());
			const truncatedCurrentDay = truncateTime(currentDay);
			const truncatedWeekStart = truncateTime(selectedWeekStart);
			const truncatedWeekEnd = truncateTime(selectedWeekEnd);
	        // 判断当前日期是否属于选中日期的那一周			
			const isThisWeek = truncatedCurrentDay >= truncatedWeekStart && truncatedCurrentDay <= truncatedWeekEnd;

	

	
	        // 设置本周日期的背景样式
	        if (isThisWeek) {
	            calendarCtx.fillStyle = "#3a3e5d"; // 本周日期背景色
	            calendarCtx.globalAlpha = 0.8; // 设置透明度
	            calendarCtx.fillRect(cellX, cellY, cellWidth, cellHeight);
	        }
    
            // 计算绝对天数并调用战场逻辑
            const absoluteDay = Math.floor((Date.UTC(year, month, day) - Date.UTC(2026, 4, 2)) / (1000 * 60 * 60 * 24));
			 
            const battleField = calculateBattleField(absoluteDay);
			//console.log(`Date: ${year}-${month + 1}-${day}, AbsoluteDay: ${absoluteDay}, BattleField: ${battleField}`);
            //console.log(`Day ${day}: BattleField = ${battleField}`);
    
            calendarCtx.globalAlpha = 1; // 恢复为不透明

			
            let battleColor;
    
            // 根据战场类型设置填充颜色
            switch (battleField) {
                case "碎冰":
                    battleColor = "#6a7dfe"; // 蓝色
                    break;
                case "尘封秘岩":
                    battleColor = "#f65e5e"; // 红色
                    break;
                case "大草原":
                    battleColor = "#ff955b"; // 黄色
                    break;
				case "阵地":
				    battleColor = "#6dc190"; // 新增的阵地颜色
				    break;
				case "沃克奇特":
				    battleColor = "#54c6c0"; // 沃克 青色
				    break;
                default:
                    battleColor = "#ffffff"; // 默认白色
            }
    
            // 简化战场名称
            const battleFieldMap = {
                "碎冰": "碎冰",
                "大草原": "草原",
				"阵地": "阵地",  // 新增简写
                "尘封秘岩": "尘封",
                "沃克奇特": "沃克"
            };
            const battleFieldShort = battleFieldMap[battleField] || battleField; // 根据映射简化名称
    
            // 绘制日期数字
			calendarCtx.font = "bold 20px Arial "; // 圆体字体样式
            calendarCtx.fillStyle = "#ffffff"; // 白色字体
            calendarCtx.fillText(day, cellX + cellWidth / 2, cellY + cellHeight / 3);
    
            // 绘制战场模式背景（圆角矩形）
            const textWidth = calendarCtx.measureText(battleFieldShort).width; // 使用简化名称的宽度
            const paddingX = 10; // 水平方向内边距
            const paddingY = 5; // 垂直方向内边距
            const borderRadius = 8; // 圆角半径
            const additionalWidth = 6; // 增加的宽度
            const rectWidth = textWidth + paddingX + additionalWidth; // 矩形宽度
            const textX = cellX + (cellWidth - rectWidth) / 2; // 根据新的矩形宽度调整起始X坐标，保持居中
            const textY = cellY + cellHeight / 2.3 + paddingY; // 矩形起始Y坐标
            const rectHeight = cellHeight / 3; // 矩形高度，与文字区域稍大
    
            calendarCtx.fillStyle = battleColor; // 背景颜色
            calendarCtx.beginPath(); // 开始路径
            calendarCtx.moveTo(textX + borderRadius, textY); // 左上角圆角起点
            calendarCtx.lineTo(textX + rectWidth - borderRadius, textY); // 上边直线
            calendarCtx.arcTo(textX + rectWidth, textY, textX + rectWidth, textY + borderRadius, borderRadius); // 右上角圆角
            calendarCtx.lineTo(textX + rectWidth, textY + rectHeight - borderRadius); // 右边直线
            calendarCtx.arcTo(textX + rectWidth, textY + rectHeight, textX + rectWidth - borderRadius, textY + rectHeight, borderRadius); // 右下角圆角
            calendarCtx.lineTo(textX + borderRadius, textY + rectHeight); // 下边直线
            calendarCtx.arcTo(textX, textY + rectHeight, textX, textY + rectHeight - borderRadius, borderRadius); // 左下角圆角
            calendarCtx.lineTo(textX, textY + borderRadius); // 左边直线
            calendarCtx.arcTo(textX, textY, textX + borderRadius, textY, borderRadius); // 左上角圆角
            calendarCtx.closePath(); // 闭合路径
            calendarCtx.fill(); // 填充圆角矩形
    
            // 绘制战场模式文字
            calendarCtx.lineWidth = 1; // 设置描边宽度
            calendarCtx.strokeStyle = "#230000"; // 黑色描边颜色
            calendarCtx.strokeText(
                battleFieldShort, // 使用简化后的名称
                cellX + cellWidth / 2,
                cellY + (2 * cellHeight) / 3
            );
            
            calendarCtx.fillStyle = "#faffe9"; // 战场模式字体颜色
            calendarCtx.fillText(
                battleFieldShort, // 使用简化后的名称
                cellX + cellWidth / 2,
                cellY + (2 * cellHeight) / 3
            );

    
            day++;
        }
		calendarCtx.globalAlpha = 1.0; // 及时恢复
    }



    // 绘制水平线（删除竖线）
    calendarCtx.strokeStyle = "#ccc";
    for (let j = 0; j <= 7; j++) {
        calendarCtx.beginPath();
        calendarCtx.moveTo(calendarConfig.x, calendarConfig.y + j * cellHeight);
        calendarCtx.lineTo(calendarConfig.x + calendarConfig.width, calendarConfig.y + j * cellHeight);
        calendarCtx.stroke();
    }
	
}


    let currentDayIndex = 0;
    const customAreas = Array(7).fill("");

    function selectDay(i) {
        currentDayIndex = i;
        syncControls();
    }

    // 把当前选中日的状态刷到控制栏上（选中态高亮、输入框回填）
    function syncControls() {
        document.querySelectorAll("#daySeg .chip").forEach((b, i) => b.classList.toggle("active", i === currentDayIndex));
        const act = selectedActivities[currentDayIndex];
        document.getElementById("btnOvertime").classList.toggle("active", act === "加班");
        document.getElementById("btnRest").classList.toggle("active", act === "休息");
        document.getElementById("customActivity").value = (act === "加班" || act === "休息") ? "" : act;
        document.querySelectorAll("[data-area]").forEach(b => b.classList.toggle("active", selectedAreas[currentDayIndex].includes(b.dataset.area)));
        document.getElementById("customArea").value = customAreas[currentDayIndex];
    }

    function setActivity(value) {
        selectedActivities[currentDayIndex] = value;
        if (value) {
            selectedAreas[currentDayIndex] = [];
            customAreas[currentDayIndex] = "";
        }
        syncControls();
        drawMainCanvas();
    }

    function toggleActivity(value) {
        setActivity(selectedActivities[currentDayIndex] === value ? "" : value);
    }

    function updateArea(value) {
        const areas = selectedAreas[currentDayIndex];
        selectedAreas[currentDayIndex] = areas.includes(value)
            ? areas.filter((area) => area !== value)
            : [...areas, value];
        syncControls();
        drawMainCanvas();
    }

    function updateCustomArea(value) {
        customAreas[currentDayIndex] = value.trim();
        drawMainCanvas();
    }

    function downloadCanvas(canvas, filename) {
        const link = document.createElement("a");
        link.download = filename;
        link.href = canvas.toDataURL("image/png");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function saveAsImage() {
        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = mainCanvas.width;
        tempCanvas.height = mainCanvas.height;
        const tempCtx = tempCanvas.getContext("2d");
        try {
            tempCtx.drawImage(mainCanvas, 0, 0);
            tempCtx.drawImage(calendarCanvas, 1360, 464);
            downloadCanvas(tempCanvas, "schedule.png");
        } catch (error) {
            console.error("保存图片失败:", error);
            alert("保存图片失败，请检查跨域或资源加载问题！");
        }
    }

    // 只导出右半边：纯色底 + 月份标题 + 当月日历（不取背景图，离线也能导）
    function exportCalendar() {
        const sy = 370, w = 551, h = 705;
        const tempCanvas = document.createElement("canvas");
        tempCanvas.width = w;
        tempCanvas.height = h;
        const tempCtx = tempCanvas.getContext("2d");
        try {
            tempCtx.fillStyle = "#1e2134"; // 纯色底，跟整体深蓝紫调一致
            tempCtx.fillRect(0, 0, w, h);
            // 月份标题，画法和主画布一致，坐标换算成相对位置
            tempCtx.font = "bold 60px heiti";
            tempCtx.fillStyle = "#f8e9d9";
            tempCtx.textAlign = "center";
            tempCtx.textBaseline = "middle";
            tempCtx.fillText(`${selectedDate.getMonth() + 1}月`, 475, 430 - sy);
            tempCtx.drawImage(calendarCanvas, 0, 464 - sy);
            downloadCanvas(tempCanvas, `calendar-${selectedDate.getFullYear()}-${selectedDate.getMonth() + 1}.png`);
        } catch (error) {
            console.error("保存日历失败:", error);
            alert("保存日历失败，请检查跨域或资源加载问题！");
        }
    }

    // 预览自适应窗口宽度；canvas 内部仍是 1920x1080，导出分辨率不受影响
    const stageOuter = document.getElementById("stageOuter");
    const stage = document.getElementById("canvasContainer");
    function fitStage() {
        const avail = document.documentElement.clientWidth - 40;
        const scale = Math.min(1, avail / 1920);
        stage.style.transform = `scale(${scale})`;
        stageOuter.style.width = 1920 * scale + "px";
        stageOuter.style.height = 1080 * scale + "px";
    }
    window.addEventListener("resize", fitStage);
    fitStage();
    syncControls();

</script>

</body>
</html>
